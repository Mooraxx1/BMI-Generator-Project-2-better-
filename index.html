<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator Project 2</title>
</head>
<body>
    <!-- total body -->
     <div class="totalBOdy">
        <!-- bmi whole window -->
        <div class="bmiWindow">
            <div class="headerBox">
                <h1 class="header">BMI Calculator</h1>
            </div>
            <!-- Age area -->
            <div class="ageBox">
                <div><h3 class="ageHeading">Age</h3></div>
                <input type="number" class="ageInput" value="30">
            </div>
            <!-- Gender area -->
            <div class="genderBox">
                <div class="genderHeading"><h3>Gender</h3></div>
                <div class="genderBtn">
                <label>
                    <input type="radio" name="gender" class="male"> Male
                </label>
                 <label>
                     <input type="radio" name="gender" class="female"> Female
                 </label>
                </div>
            </div>
            <!-- Height and weight area -->
            <div class="infoBox">
                <!-- height -->
                <div class="heightBox">
                    <div><h4>Height(CM)</h4></div>
                    <input type="text" class="heightIntake" value="180">
                </div>
                <!-- weight -->
                <div class="weightBox">
                    <div><h4>Weight(KG)</h4></div>
                    <input type="text" class="weightIntake" value="80">
                </div>
            </div>
            <!-- button to calculate -->
            <div class="btnBox">
                <button class="btnCalculate">Calculate BMI</button>
            </div>
            <!-- result -->
            <div class="resultBox">
                <div><h3>Your BMI Is:</h3></div>
                <input class="bmiResult" placeholder="00.00">
            </div>
            <!-- extra hint -->
            <div class="extraHintBox">
                <h3>You are <span class="extraHintSpan">Healthy</span></h3>
            </div>
        </div>
     </div>
    
    <script src="./index.js"></script>
</body>
</html>
